[preview]
tab_size = 2

[plugin]
prepend_preloaders = [
  { url = "*.{csv,tsv,parquet,txt,xlsx}", run = "duckdb" },
  { mime = "video/*", run = "noop", if = "size > 100M" },
  { url = "/run/{user/1000/gvfs,media/USER_NAME}/**/*", run = "noop" },
]

prepend_previewers = [
  { url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
  { mime = "application/sqlite3", run = 'piper -- sqlite3 "$1" ".schema --indent"' },
  { url = "*.{csv,tsv,parquet,txt,xlsx,db,duckdb}", run = "duckdb" },
  { mime = "video/*", run = "noop", if = "size > 100M" },
  { url = "*/", run = "folder" },
  { url = "/run/{user/1000/gvfs,media/USER_NAME}/**/*", run = "noop" },
]

[mgr]
linemode = "size_and_mtime"

[opener]
edit = [{ run = 'nvim %s', block = true, desc = "Neovim" }]
neovide = [
  { run = 'neovide --fork %s', orphan = true, desc = "Neovide (GUI, new window)" },
]
docs = [{ run = 'zathura %s', desc = "Zathura" }]
media = [{ run = 'mpv --force-window %s', orphan = true, desc = "MPV (video)" }]
audio = [
  { run = 'mpv --force-window=immediate --geometry=300x300 --script-opts=osc-visibility=always --no-fullscreen %s', orphan = true, desc = "MPV (audio, mini)" },
]
images = [{ run = 'swayimg %s', orphan = true, desc = "swayimg" }]
default = [{ run = 'xdg-open %s', desc = "System Default" }]
extract = [
  { run = 'kitty -e fuse-mounter %s1', desc = "Mount archive" },
  { run = 'xarchiver %s1', desc = "Xarchiver (распаковать во временную)" },
  { run = 'xdg-open %s', desc = "System Default" },
  { run = 'mkdir -p "${1%.*}" && 7z x -y "$1" -o"${1%.*}"', desc = "Распаковать в папку" },
]

[open]
rules = [
  { url = "*/", use = [
    "edit",
    "neovide",
    "open",
    "reveal",
  ] },
  # Код и конфиги
  { mime = "application/{json,javascript,xml,toml,yaml}", use = [
    "edit",
    "neovide",
  ] },

  # Архивы — все идут в extract (mount / tui-archiver / распаковка)
  { mime = "application/{gzip,x-gzip,x-tar,zip,x-zip-compressed,x-7z-compressed,7z-compressed,rar,x-rar,x-rar-compressed,vnd.rar,x-bzip2,x-xz,zstd,x-zstd-compressed-tar,x-lzma,x-lzip,x-lz4,x-lzop,x-brotli,x-cpio,x-iso9660-image,x-debian-package,x-rpm,x-compressed-ace,x-compressed-arj,x-compressed-sit,x-cab,vnd.ms-cab-compressed,x-apple-diskimage,x-lha,x-lzh,x-tgz,x-bzip-compressed-tar}", use = [
    "extract",
    "reveal",
  ] },

  # Книги и документы
  { mime = "application/{pdf,epub+zip}", use = "docs" },
  { mime = "image/djvu", use = "docs" },
  { url = "*.fb2", use = "docs" },

  # Общие категории
  { mime = "text/*", use = [
    "edit",
    "neovide",
    "default",
  ] },
  { mime = "image/*", use = [
    "images",
    "default",
  ] },
  { mime = "video/*", use = [
    "media",
    "default",
  ] },
  { mime = "audio/*", use = [
    "audio",
    "default",
  ] },
  { mime = "*", use = "default" },
]
